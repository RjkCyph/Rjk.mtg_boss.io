<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MTG Boss Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <h1>MTG Legendary Boss Generator</h1>
    <p class="subtitle">Genera jefes épicos a partir de comandantes legendarios de Magic: The Gathering</p>
  </header>

  <main>
    <section id="controls">
      <button class="btn primary" onclick="generateBoss()">
        <span class="btn-icon">🔀</span>
        <span>Generar Jefe</span>
      </button>

      <button class="btn secondary" onclick="generateDungeon()">
        <span class="btn-icon">🕳️</span>
        <span>Modo Mazmorra (3 jefes)</span>
      </button>

      <select id="colorFilter" class="select">
        <option value="">Cualquier color</option>
        <option value="W">Blanco</option>
        <option value="U">Azul</option>
        <option value="B">Negro</option>
        <option value="R">Rojo</option>
        <option value="G">Verde</option>
      </select>

      <button class="btn ghost" onclick="exportJSON()">
        <span class="btn-icon">📦</span>
        <span>Exportar JSON</span>
      </button>
    </section>

    <section id="hint">
      <p>Pulsa <span class="keycap">Espacio</span> para generar un jefe</p>
    </section>

    <section id="bossContainer"></section>
  </main>

  <footer id="version">
    Data from Scryfall — © Wizards of the Coast — MTG Boss Generator v1.1
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
