<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MTG Boss Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>MTG Legendary Boss Generator</h1>

  <div id="controls">
    <button onclick="generateBoss()">Generar Jefe</button>
    <button onclick="generateDungeon()">Modo Mazmorra (3 jefes)</button>

    <select id="colorFilter">
      <option value="">Cualquier color</option>
      <option value="W">Blanco</option>
      <option value="U">Azul</option>
      <option value="B">Negro</option>
      <option value="R">Rojo</option>
      <option value="G">Verde</option>
    </select>

    <button onclick="exportJSON()">Exportar JSON</button>
  </div>

  <div id="bossContainer"></div>

  <script src="script.js"></script>
</body>
<footer id="version">
  MTG Boss Generator — v1.0
</footer>

</html>
